openapi: 3.0.3
info:
  title: OneF Integration API
  version: 1.3.0
  description: |
    API for OneF (1F) ERP to communicate with the Recruitment Platform.

    ## Two directions of traffic

    **1F → Platform.** Every path in this document is served by the Recruitment
    Platform. Call them at the `servers` base URL below.

    **Platform → 1F.** The platform also pushes events *to* 1F at
    `http://192.168.1.47/app/v1.2/api/publications/action/…`
    (`candidateResponse`, `postTestStatus`, `receivemessage`). Those payloads are
    documented under the **Webhooks** tag — 1F implements the receiving side, not
    this platform.

    **Platform ← 1F (read).** The platform pulls the vacancy catalogue from
    `GET http://192.168.1.47/app/v1.2/api/publications/action/getVacancies`.
    That endpoint is served by 1F. Only that host serves it; the others answer 404.

    ## Conventions

    - Requests may be sent bare or wrapped in `{"requestBody": {...}}`. Both are accepted.
    - `candidate_id` is always the platform UUID that 1F received in `new_application`
      and every subsequent webhook. 1F's own candidate identifiers are not stored here.
    - Vacancies carry two ids: `vacancy_id_1f` (1F's internal id, the stable key) and
      `external_vacancy_id` (the job-board id, a numeric string). Both are returned
      everywhere so either can be used to join.
    - Rate limited to `INTEGRATION_RPS` requests per second (default 10).
    - Errors are `{"error": "<message>"}` with a matching HTTP status.
servers:
  - url: https://dchr.koinotinav.com/api/onef
    description: Recruitment Platform — production
  - url: http://{host}:8888/api/onef
    description: Recruitment Platform — direct backend access on the internal network
    variables:
      host:
        default: srv-dchr01

tags:
  - name: Matching
    description: |
      AI ranking of the 1F vacancy catalogue for a given candidate.

      This is a self-contained subsystem: it keeps its own synced copy of 1F's
      vacancies and does not touch the platform's own `/vacancies` records or the
      application pipeline.
  - name: Dashboard
  - name: Candidates
  - name: Messaging
  - name: Tests
  - name: Vacancies
  - name: Dictionaries
  - name: AI
  - name: Webhooks

paths:
  /dashboard:
    get:
      summary: Get Dashboard Stats
      description: Retrieves high-level recruitment metrics and funnel data.
      tags:
        - Dashboard
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneFDashboardStats'

  /candidates:
    get:
      summary: List Candidates
      description: Retrieves a list of all registered candidates.
      tags:
        - Candidates
      responses:
        '200':
          description: Array of candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OneFCandidateResponse'

  /candidates/{id}:
    get:
      summary: Get Candidate Details
      description: Retrieves full profile information for a specific candidate.
      tags:
        - Candidates
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Candidate details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneFCandidateResponse'
        '404':
          description: Candidate not found

  /candidates/{id}/status:
    post:
      summary: Update Candidate Status
      description: Updates the recruitment status for a specific candidate.
      tags:
        - Candidates
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneFUpdateStatusRequest'
      responses:
        '200':
          description: Status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                  updated_at:
                    type: string
                    format: date-time

  /candidates/{id}/analyze:
    post:
      summary: Analyze Candidate Suitability
      description: Triggers a manual AI suitability analysis for the candidate.
      tags:
        - Candidates
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Analysis successful
        '404':
          description: Candidate not found

  /pipeline/advise:
    post:
      summary: Stage-Aware Pipeline Advisor (AI)
      description: >
        Context-aware AI co-pilot for the recruitment funnel. 1F sends the current `stage`
        plus all accumulated `history` (every prior stage's results as held in the 1F card),
        and the model — aware of the whole pipeline — returns a cross-stage summary, a
        proceed/hold/reject recommendation, a 0-100 score, concrete advice, and (for interview
        stages) a list of questions tailored from prior-stage data. Stateless: nothing is read
        from or written to the platform DB, so HR can call it at any point in the process.
      tags:
        - AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneFPipelineAdviceRequest'
      responses:
        '200':
          description: AI recommendation for the requested stage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneFPipelineAdvice'
        '400':
          description: Unknown or missing stage
        '500':
          description: AI provider error

  /candidates/{id}/attempts:
    get:
      summary: Get Candidate Test Attempts
      description: Lists all test attempts for a specific candidate.
      tags:
        - Candidates
        - Tests
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of attempts
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OneFAttempt' # Attempt object
                  total:
                    type: integer

  /messages:
    post:
      summary: Send Message to Candidate
      description: Sends a message to a candidate via the Telegram Bot.
      tags:
        - Messaging
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneFSendMessageRequest'
      responses:
        '200':
          description: Message sent successfully
        '400':
          description: Candidate has no linked Telegram account
        '404':
          description: Candidate not found
        '500':
          description: Telegram API failure

  /messages/{candidate_id}:
    get:
      summary: Get Chat History
      description: Returns chat history for a candidate. Automatically marks inbound messages as read.
      tags:
        - Messaging
      parameters:
        - in: path
          name: candidate_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chat history array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OneFChatMessage'

  /messages/unread:
    get:
      summary: Get Global Unread Messages Count
      tags:
        - Messaging
      responses:
        '200':
          description: Unread message count
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread_count:
                    type: integer

  /tests:
    get:
      summary: List Active Tests
      description: Lists all active tests available for assignments.
      tags:
        - Tests
      responses:
        '200':
          description: List of tests
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OneFTestSummary'
                  total:
                    type: integer

  /invites:
    post:
      summary: Create Test Invite
      description: Generates a new test attempt/link for a candidate and notifies them via Telegram.
      tags:
        - Tests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneFCreateInviteRequest'
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                type: object
                properties:
                  attempt_id:
                    type: string
                    format: uuid
                  access_token:
                    type: string
                  test_url:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  status:
                    type: string
                  candidate_name:
                    type: string
                  test_title:
                    type: string

  /attempts_filter:
    get:
      summary: Filter Test Attempts
      description: Filterable and paginated list of all test attempts.
      tags:
        - Tests
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: email
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Paginated attempts
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OneFAttempt'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer

  /attempts:
    get:
      summary: List All Test Attempts
      description: Returns a raw, unpaginated (or large limit) list of all attempts without filters.
      tags:
        - Tests
      responses:
        '200':
          description: List of all attempt objects
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /attempts/{id}:
    get:
      summary: Get Attempt Details
      description: Retrieves detailed results for a specific attempt, including answers.
      tags:
        - Tests
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detailed attempt data
          content:
            application/json:
              schema:
                type: object
                properties:
                  attempt:
                    $ref: '#/components/schemas/OneFAttempt'
                  test_title:
                    type: string
                  test_type:
                    type: string

  /vacancies:
    get:
      summary: List Published Vacancies
      description: Lists active internal and external (Koinoti Nav) vacancies.
      tags:
        - Vacancies
      responses:
        '200':
          description: Array of vacancies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OneFVacancyResponse'
  /vacancies/external:
    post:
      summary: Create External Vacancy (Triggers Selenium Script)
      description: Launches Python Selenium to create a vacancy in job.koinotinav.tj.
      tags:
        - Vacancies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneFExternalVacancyPayload'
      responses:
        '202':
          description: Workflow queued/accepted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneFExternalVacancyResult'
        '400':
          description: Invalid payload

  /vacancies/external/delete:
    post:
      summary: Delete External Vacancy (Triggers Selenium Script)
      description: Launches Python Selenium to delete an external vacancy.
      tags:
        - Vacancies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneFExternalVacancyDeletePayload'
      responses:
        '202':
          description: Workflow queued/accepted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneFExternalVacancyResult'
        '400':
          description: Invalid payload

  /vacancies/description:
    post:
      summary: Generate AI Vacancy Description
      description: Uses OpenAI to generate a professional vacancy description based on provided parameters (title, company, location, skills, etc.).
      tags:
        - Vacancies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneFGenerateDescriptionPayload'
      responses:
        '200':
          description: AI-generated description
          content:
            application/json:
              schema:
                type: object
                properties:
                  description:
                    type: string
        '400':
          description: Invalid payload

  /dictionaries/candidate-statuses:
    get:
      summary: Dictionary of Candidate Statuses
      tags:
        - Dictionaries
      responses:
        '200':
          description: Key-value pair options for dropdowns.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    label:
                      type: string

  /dictionaries/test-statuses:
    get:
      summary: Dictionary of Test Statuses
      tags:
        - Dictionaries
      responses:
        '200':
          description: Key-value pair options for dropdowns.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    label:
                      type: string

  # OneF Endpoint that Recruitment Platform calls
  /action/postTestStatus:
    post:
      summary: "[Webhook] OneF Test Status Receiver"
      description: "Recruitment Platform calls this endpoint on OneF side whenever a test attempt is started or completed."
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requestBody:
                   $ref: '#/components/schemas/OneFTestStatusPayload'
      responses:
        '200':
          description: OK

  /action/receivemessage:
    post:
      summary: "[Webhook] OneF Inbound Message Receiver"
      description: "Recruitment Platform calls this when a candidate sends a message via Telegram. These messages appear in the OneF chat."
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requestBody:
                   type: object
                   properties:
                     event_type:
                       type: string
                       example: "new_message"
                     candidate_id:
                       type: string
                       format: uuid
                     vacancy_id:
                       type: integer
                       description: "Specific vacancy ID this message belongs to"
                     telegram_id:
                       type: integer
                     text:
                       type: string
                     received_at:
                       type: string
                       format: date-time
      responses:
        '200':
          description: OK

  /action/candidateResponse:
    post:
      summary: "[Webhook] OneF Candidate Event Receiver"
      description: "Recruitment Platform calls this for various candidate events like application, status changes, and AI grade sharing."
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requestBody:
                  oneOf:
                    - $ref: '#/components/schemas/OneFNewApplicationEvent'
                    - $ref: '#/components/schemas/OneFGradeSharedEvent'
                    - $ref: '#/components/schemas/OneFCandidateStatusChangedEvent'
      responses:
        '200':
          description: OK

  /matching/candidate:
    post:
      summary: Rank Vacancies For A Candidate (AI)
      tags:
        - Matching
      description: |
        Scores the entire 1F vacancy catalogue for one candidate and returns the best
        matches, ordered from strongest to weakest.

        **`candidate_id` is the platform UUID 1F already holds** — the `candidate.id`
        sent in `new_application` and the `candidate_id` in every later webhook. No
        candidate data is read from 1F; the profile is built from the CV stored here.

        ### How a request is processed

        1. The candidate is loaded from the platform database. Unknown UUID → `404`.
        2. Their CV is read into a structured profile. Image CVs (png/jpg/webp) and
           unreadable PDFs are processed with Vision automatically. This profile is
           cached and re-extracted only when the CV or the candidate's details change.
        3. **If the CV yields no professional information**, the response returns
           `scoreable: false` with a `reason` and an empty `matches` array.
           Always check `scoreable` before reading scores.
        4. Otherwise every active vacancy is scored in a single comparative pass — they
           are judged against each other, not in isolation — and the top `top_n`
           are returned.

        ### Caching

        Repeat calls are served from stored results and cost nothing. A result is
        recomputed when the candidate's CV changes, when the vacancy catalogue changes,
        or when `force_refresh` is set. `cached` tells you which happened.

        A cold call runs two AI requests and typically takes 5-15 seconds. Set your
        client timeout to at least 60 seconds.

        ### Age and gender

        Age and gender **never influence the score**. They are reported in `flags` so a
        recruiter can apply them as a human judgement:

        - `age_mismatch` compares the vacancy's stated age band against the candidate's
          date of birth. It is absent when the vacancy sets no age requirement or the
          candidate has no date of birth on file.
        - `gender_requirement` echoes what the vacancy asks for. The platform stores no
          gender for candidates, so it is never compared.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneFMatchRequest'
            examples:
              minimal:
                summary: Minimal request
                value:
                  candidate_id: "a109320e-407e-4f26-936b-3a9bff5ed82f"
              wrapped:
                summary: Wrapped in requestBody, top 3, forced recompute
                value:
                  requestBody:
                    candidate_id: "a109320e-407e-4f26-936b-3a9bff5ed82f"
                    top_n: 3
                    force_refresh: true
      responses:
        '200':
          description: |
            Ranking complete, or the candidate could not be scored. Check `scoreable`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneFMatchResult'
        '400':
          description: Malformed payload, or the vacancy catalogue is empty
        '404':
          description: No candidate with that UUID

  /matching/vacancies:
    get:
      summary: List The Synced 1F Vacancy Catalogue
      tags:
        - Matching
      description: |
        The platform's local copy of `action/getVacancies`, refreshed on a timer.
        Useful for confirming what the matcher is scoring against and when it last
        synced. Withdrawn vacancies are kept with `is_active: false` rather than
        deleted, so historical rankings still resolve.
      parameters:
        - in: query
          name: include_inactive
          required: false
          schema:
            type: boolean
            default: false
          description: Also return vacancies 1F has stopped listing.
      responses:
        '200':
          description: The catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneFCatalogueList'

  /matching/vacancies/{vacancy_id_1f}:
    get:
      summary: Get One Catalogue Vacancy
      tags:
        - Matching
      parameters:
        - in: path
          name: vacancy_id_1f
          required: true
          schema:
            type: integer
            format: int64
          description: 1F's internal vacancy id (`VacancyId1F`), not the job-board id.
      responses:
        '200':
          description: The vacancy as stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneFCatalogueVacancy'
        '404':
          description: Not in the catalogue

  /matching/sync:
    post:
      summary: Refresh The Vacancy Catalogue Now
      tags:
        - Matching
      description: |
        Forces an immediate pull from `action/getVacancies` instead of waiting for the
        timer. Use after publishing or editing a vacancy in 1F so the matcher sees it
        without delay.

        The sync is a full snapshot replace. If 1F returns an empty list it is treated
        as a fault and the existing catalogue is left untouched — an empty catalogue is
        never written.
      responses:
        '200':
          description: What the sync changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneFSyncSummary'
        '400':
          description: Catalogue reading is not configured
        '502':
          description: 1F could not be reached, or returned something unparseable

components:
  schemas:
    OneFPipelineAdviceRequest:
      type: object
      required:
        - stage
      properties:
        stage:
          type: string
          description: Current funnel stage to advise on.
          enum:
            - cv_screening
            - phone_interview
            - interview_1
            - test_task
            - presentation
            - interview_2
            - final_decision
        candidate:
          type: object
          description: Free-form candidate context (e.g. name, email, phone, region).
          additionalProperties: true
          example:
            name: Иван Петров
            email: ivan@example.com
            phone: "+992900000000"
            region: Душанбе
        vacancy:
          type: object
          description: Free-form vacancy context (e.g. title, description).
          additionalProperties: true
          example:
            title: Backend-разработчик (Rust)
            description: Проектирование и поддержка сервисов на Rust/axum...
        history:
          type: object
          description: >
            Accumulated results of prior stages, keyed by stage name, exactly as held in the
            1F card. Free-form — pass whatever fields are already filled.
          additionalProperties: true
          example:
            cv_screening:
              score: 78
              insights: Сильный бэкенд-опыт, мало опыта с очередями сообщений.
            phone_interview:
              hr_summary: Хорошая коммуникация, ожидания по зарплате выше вилки.
        language:
          type: string
          description: Output language for human-readable text.
          default: ru
          example: ru

    OneFPipelineAdvice:
      type: object
      properties:
        stage:
          type: string
          description: Echo of the evaluated stage.
        summary:
          type: string
          description: Cross-stage summary of where the candidate stands in the funnel.
        recommendation:
          type: string
          description: Suggested next move.
          enum:
            - proceed
            - hold
            - reject
        score:
          type: integer
          description: Overall fit/confidence to advance, 0-100.
          minimum: 0
          maximum: 100
        advice:
          type: array
          description: Concrete advice / next actions for the HR running this stage.
          items:
            type: string
        suggested_questions:
          type: array
          description: Questions tailored from prior-stage data (empty for non-interview stages).
          items:
            type: string
        risk_flags:
          type: array
          description: Risks, gaps or red flags worth probing further.
          items:
            type: string

    OneFDashboardStats:
      type: object
      properties:
        candidates_total:
          type: integer
        candidates_new_today:
          type: integer
        active_vacancies:
          type: integer
        test_attempts_pending:
          type: integer
        recruitment_funnel:
          $ref: '#/components/schemas/RecruitmentFunnel'

    RecruitmentFunnel:
      type: object
      properties:
        registered:
          type: integer
        applied:
          type: integer
        test_started:
          type: integer
        test_completed:
          type: integer
        hired:
          type: integer

    OneFCandidateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        telegram_id:
          type: integer
          nullable: true
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        cv_url:
          type: string
          nullable: true
        status:
          type: string
        ai_rating:
          type: integer
          nullable: true
        ai_comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true

    OneFChatMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        direction:
          type: string
          enum: [inbound, outbound]
        text:
          type: string
        created_at:
          type: string
          format: date-time
        is_read:
          type: boolean

    OneFTestSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        test_type:
          type: string
        duration_minutes:
          type: integer
        passing_score:
          type: number
          format: float
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          nullable: true

    OneFSendMessageRequest:
      type: object
      required:
        - candidate_id
        - text
      properties:
        candidate_id:
          type: string
          format: uuid
        text:
          type: string

    OneFUpdateStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string

    OneFCreateInviteRequest:
      type: object
      required:
        - candidate_id
        - test_id
      properties:
        candidate_id:
          type: string
          format: uuid
        test_id:
          type: string
          format: uuid
        expires_in_hours:
          type: integer
          description: Expiration time in hours. Defaults to 48 for tests, or calculated for presentations if duration is set.
          default: 48
        vacancy_id:
          type: integer
          nullable: true
          description: Optional vacancy ID. Useful for associating this test attempt with a specific application.



    OneFVacancyResponse:
      type: object
      properties:
        id:
